name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6)
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.*.app/Contents/Developer || true

      - name: Build .app
        working-directory: SkillReaderApp
        run: ./scripts/build_app.sh "$PWD/build/SkillReader.app"

      - name: Build .dmg
        working-directory: SkillReaderApp
        env:
          # tag 形如 v1.2.3 → 版本号 1.2.3；手动触发用 1.0
          APP_VERSION: ${{ startsWith(github.ref_name, 'v') && format('{0}', github.ref_name) || '1.0' }}
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build_dmg.sh
      - name: Attach .dmg to GitHub Release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: SkillReaderApp/build/*.dmg
          generate_release_notes: true
