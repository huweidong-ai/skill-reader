<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Skill Reader</title>
<script>
  // 跟随系统深浅模式：设置 <html data-theme>，驱动 CSS 主题变量
  (function () {
    var m = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = m.matches ? "dark" : "light"; }
    apply();
    if (m.addEventListener) m.addEventListener("change", apply);
    else if (m.addListener) m.addListener(apply);
  })();
</script>
<link rel="stylesheet" href="github.min.css">
<style>
/* ============================================================
   Skill Reader · 现代靛蓝主题（WKWebView 正文渲染）
   与 Web 版共用同一设计语言；深浅主题由 data-theme 驱动
   ============================================================ */
:root {
  --accent: #007AFF;
  --accent-hover: #005FCC;
  --accent-press: #004999;
  --accent-soft: rgba(0, 122, 255, 0.10);
  --accent-border: rgba(0, 122, 255, 0.30);
  --accent-grad: linear-gradient(135deg, #339CFF 0%, #007AFF 100%);

  --bg: #ffffff;
  --bg-sub: #f6f7fb;
  --bg-hover: #eef0f6;
  --border: #e6e8f0;
  --border-strong: #d8dbe8;

  --text: #1c2030;
  --text-2: #525b73;
  --text-3: #8b93a9;

  --code-bg: #151823;
  --code-gutter: #10121a;
  --code-border: #262b3a;
  --code-text: #e2e8f0;
  --code-comment: #6e7690;
  --code-keyword: #c792ea;
  --code-string: #9cd9a0;
  --code-number: #f78c6c;
  --code-func: #82aaff;
  --code-attr: #ffcb6b;
  --code-builtin: #89ddff;

  --inline-code-bg: rgba(0, 122, 255, 0.10);
  --inline-code-text: #005FCC;
  --link: #007AFF;
  --shadow-sm: 0 1px 2px rgba(23, 26, 42, 0.05), 0 1px 3px rgba(23, 26, 42, 0.04);
  --shadow-md: 0 2px 4px rgba(23, 26, 42, 0.04), 0 12px 28px rgba(23, 26, 42, 0.08);
  --shadow-lg: 0 4px 8px rgba(23, 26, 42, 0.05), 0 24px 48px rgba(23, 26, 42, 0.12);
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --table-stripe: #f8f9fd;
}

html[data-theme="dark"] {
  --accent: #0A84FF;
  --accent-hover: #409CFF;
  --accent-press: #0066CC;
  --accent-soft: rgba(10, 132, 255, 0.16);
  --accent-border: rgba(10, 132, 255, 0.35);
  --accent-grad: linear-gradient(135deg, #409CFF 0%, #0A84FF 100%);

  --bg: #12141b;
  --bg-sub: #171a23;
  --bg-hover: #1d2130;
  --border: #262b3a;
  --border-strong: #323848;

  --text: #e7eaf3;
  --text-2: #a5adc4;
  --text-3: #6e7690;

  --inline-code-bg: rgba(10, 132, 255, 0.16);
  --inline-code-text: #70B8FF;
  --link: #0A84FF;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.4), 0 12px 28px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.4), 0 24px 48px rgba(0, 0, 0, 0.5);
  --table-stripe: #1a1e2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}
::selection { background: var(--accent); color: #fff; }
/* 深色代码块区域内选中高亮：截图浅蓝底深色字 */
.md-body pre ::selection,
.code-body ::selection,
.source-view ::selection,
.plain-view pre ::selection { background: #B3D7FF; color: #151823; }
#content { padding: 30px 28px 90px; overflow-y: auto; height: 100vh; }
/* 代码/纯文本/Source view 贴底撑满 */
body.code-view #content { padding-bottom: 0; overflow: hidden; }
body.code-view .code-view {
  height: calc(100vh - 30px);
  display: flex; flex-direction: column;
}
body.code-view .code-body { flex: 1 1 auto; max-height: none; }

/* ---------- 欢迎页 ---------- */
.welcome {
  height: 100%; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(600px 300px at 50% 28%, var(--accent-soft), transparent 70%),
    var(--bg);
}
.welcome-card { text-align: center; max-width: 520px; padding: 44px; }
.welcome-logo {
  width: 76px; height: 76px; margin: 0 auto; border-radius: 22px;
  background: var(--accent-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-lg);
}
.welcome-logo svg { display: block; }
.welcome-card h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; margin: 20px 0 10px; color: var(--text); }
.welcome-card p { font-size: 14px; color: var(--text-2); line-height: 1.9; }
.welcome-card p b { color: var(--text); }
.welcome-hint { color: var(--text-3) !important; font-size: 13px !important; margin-top: 16px; letter-spacing: .02em; }

/* ---------- Markdown 正文 ---------- */
.md-body { max-width: 820px; margin: 0 auto; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
  color: var(--text); font-weight: 700; line-height: 1.4; margin: 1.5em 0 .6em;
  scroll-margin-top: 60px; letter-spacing: -0.01em;
}
.md-body h1 { font-size: 27px; border-bottom: 1px solid var(--border); padding-bottom: .4em; }
.md-body h2 { font-size: 21px; border-bottom: 1px solid var(--border); padding-bottom: .32em; }
.md-body h3 { font-size: 17px; }
.md-body h4 { font-size: 15px; }
.md-body p { margin: .75em 0; line-height: 1.85; color: var(--text); text-wrap: pretty; }
/* 正文首元素不吃大上边距，标题卡在正文顶部更紧凑 */
.md-content > :first-child { margin-top: 0; }
.md-body a { color: var(--link); text-decoration: none; cursor: pointer; }
.md-body a:hover { text-decoration: underline; }

/* 注意：不要在这里使用 user-select: contain。WebKit 的 contain 实现有明显怪癖——
   双击段落会直接选中整个元素（连同文字右侧的空白区域一起高亮），复制时把块尾
   空白/换行也带上，等于「选不中只有文字的部分」。跨块溢出改由下方 mouseup
   收口逻辑兜底，选区粒度保持 WebKit 原生（双击选词、三击选段）。 */

/* 选中高亮：半透明+圆角，柔化整行选中时的突兀感，但保持足够可见 */
.md-body ::selection {
  background: rgba(0, 122, 255, 0.25);
  color: inherit;
  border-radius: 4px;
}
html[data-theme="dark"] .md-body ::selection {
  background: rgba(10, 132, 255, 0.38);
  color: inherit;
}

/* 正文内查找高亮：普通命中用暖黄，当前命中用橙（深浅模式均清晰可读） */
mark.sr-find {
  background: rgba(255, 214, 10, 0.42);
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}
mark.sr-find-current {
  background: rgba(255, 149, 0, 0.92);
  color: #fff;
}
html[data-theme="dark"] mark.sr-find {
  background: rgba(255, 214, 10, 0.32);
}
html[data-theme="dark"] mark.sr-find-current {
  background: rgba(255, 149, 0, 0.95);
}
.md-body ul, .md-body ol {
  margin: .75em 0; padding-left: 0; line-height: 1.85;
  display: block;
  list-style: none;
}
.md-body li {
  margin: .28em 0;
  display: block;
  position: relative;
  padding-left: 1.5em;
}
/* 自定义列表标记；配合 ::selection 柔和高亮，跨列表项溢出由 mouseup 收口处理 */
.md-body ul > li::before {
  content: "•";
  position: absolute; left: 0; top: .55em;
  transform: translateY(-50%);
  color: var(--text-2);
}
.md-body ol { counter-reset: sr-list; }
.md-body ol > li { counter-increment: sr-list; }
.md-body ol > li::before {
  content: counter(sr-list) ".";
  position: absolute; left: 0; top: .55em;
  transform: translateY(-50%);
  color: var(--text-2); font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.md-body li > ul, .md-body li > ol {
  margin: .2em 0; padding-left: 1.5em;
  display: block;
  list-style: none;
}
/* 任务列表不显示额外圆点 */
.md-body li:has(> input[type="checkbox"])::before { display: none; }
.md-body blockquote {
  margin: 1em 0; padding: .6em 1.1em; color: var(--text-2);
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  border-radius: 0 10px 10px 0;
}
.md-body blockquote p { margin: .4em 0; color: var(--text-2); }
.md-body code:not(pre code) {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .87em; background: var(--inline-code-bg);
  padding: .15em .38em; border-radius: 5px; color: var(--inline-code-text);
}
.md-body pre {
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: 12px; padding: 14px 16px;
  overflow-x: auto; line-height: 1.65; margin: 0;
  box-shadow: var(--shadow-sm);
  user-select: text; -webkit-user-select: text;
}
.md-body pre code {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px; background: transparent; padding: 0; color: var(--code-text);
  user-select: text; -webkit-user-select: text;
}
/* Markdown 代码块：外层包裹 + 右上角复制按钮（悬停时浮现，不干扰阅读） */
.md-code { position: relative; margin: 1em 0; }
.md-code .md-code-copy {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  height: 24px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-sub);
  font-size: 11px; color: var(--text-2); cursor: pointer;
  font-family: inherit; transition: all .15s;
  opacity: 0;
}
.md-code:hover .md-code-copy,
.md-code .md-code-copy:focus-visible { opacity: 1; }
.md-code .md-code-copy:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
/* 代码文件查看器也确保可选中 */
.code-body, .code-body pre, .code-body pre code { user-select: text; -webkit-user-select: text; }
.md-body table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: 13.5px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.md-body th, .md-body td { border: 1px solid var(--border); padding: 8px 14px; }
.md-body th { background: var(--bg-sub); font-weight: 600; color: var(--text); }
.md-body tr:nth-child(2n) td { background: var(--table-stripe); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 1.8em 0; }
.md-body img { max-width: 100%; border-radius: 10px; box-shadow: var(--shadow-sm); }
.md-body del { color: var(--text-3); }
.md-body details { margin: 1em 0; }
.md-body summary { cursor: pointer; font-weight: 600; color: var(--text); }

/* ---------- Frontmatter 卡片 ---------- */
.fm-card {
  position: relative;
  background: linear-gradient(180deg, var(--bg-sub), var(--bg));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 26px;
  box-shadow: var(--shadow-sm);
}
.fm-card::before {
  content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px;
  background: var(--accent-grad); border-radius: 0 3px 3px 0;
}
.fm-title { font-size: 23px; font-weight: 700; color: var(--text); line-height: 1.4; letter-spacing: -0.2px; }
.fm-desc { font-size: 14px; color: var(--text-2); margin-top: 7px; line-height: 1.85; }
.fm-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.fm-chip {
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text-2);
}
.fm-chip b { color: var(--text); font-weight: 600; margin-right: 5px; }

/* ---------- 代码查看器（深色代码块） ---------- */
.code-view { max-width: 1000px; margin: 0 auto; }
.code-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border); border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--bg-sub);
}
.code-header .fname { font-weight: 600; font-size: 13px; color: var(--text); }
.code-header .flang {
  font-size: 10.5px; padding: 2px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--accent-border); font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
}
.code-header .fsize { font-size: 12px; color: var(--text-3); }
.code-header .spacer { flex: 1; }
.text-btn {
  height: 28px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: 12px; font-weight: 500; color: var(--text-2); cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.text-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
.code-body {
  display: flex; border: 1px solid var(--code-border);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  background: var(--code-bg); max-height: calc(100vh - 200px);
  overflow: auto;
}
.code-gutter {
  flex-shrink: 0; padding: 14px 10px; text-align: right;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.65; color: var(--code-comment);
  background: var(--code-gutter); border-right: 1px solid rgba(255, 255, 255, 0.06);
  user-select: none; position: sticky; left: 0;
}
.code-gutter span { display: block; }
.code-body pre {
  flex: 1; margin: 0; padding: 14px 16px; overflow: visible;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.65; min-width: max-content;
}
.code-body pre code { background: transparent; font-family: inherit; color: var(--code-text); }

/* ---------- 图片 / 其他 ---------- */
.img-view { max-width: 1000px; margin: 0 auto; text-align: center; }
.img-view img { max-width: 100%; max-height: calc(100vh - 200px); border-radius: 12px; box-shadow: var(--shadow-md); }
.file-meta { font-size: 13px; color: var(--text-2); text-align: center; margin-bottom: 16px; }
.pdf-view { max-width: 100%; margin: 0 auto; }
.pdf-view iframe { width: 100%; height: calc(100vh - 200px); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.plain-view pre {
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: var(--radius-lg); padding: 16px 18px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.7; overflow: auto; white-space: pre-wrap; word-break: break-word;
  color: var(--code-text);
}
.unsupported { text-align: center; padding: 70px 24px; color: var(--text-2); font-size: 14px; }
.unsupported .big { font-size: 40px; margin-bottom: 12px; }
.unsupported .big svg { display: inline-block; color: var(--text-3); }
.source-view {
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: var(--radius-lg); padding: 18px 20px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.7; overflow: auto;
  white-space: pre-wrap; word-break: break-word; color: var(--code-text);
}
.loading { padding: 70px; text-align: center; color: var(--text-3); font-size: 14px; }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 5px;
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; border: 2px solid transparent; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- highlight.js 深色代码主题（覆盖 github.min.css） ---------- */
.hljs { color: var(--code-text); background: transparent; }
.hljs-comment, .hljs-quote, .hljs-code, .hljs-formula, .hljs-subst {
  color: var(--code-comment); font-style: italic;
}
.hljs-doctag, .hljs-keyword, .hljs-template-tag, .hljs-template-variable,
.hljs-type, .hljs-variable.language_, .hljs-selector-tag {
  color: var(--code-keyword);
}
.hljs-string, .hljs-meta .hljs-string, .hljs-regexp { color: var(--code-string); }
.hljs-number, .hljs-literal, .hljs-meta, .hljs-symbol, .hljs-operator {
  color: var(--code-number);
}
.hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__,
.hljs-title.function_, .hljs-section { color: var(--code-func); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-selector-attr,
.hljs-selector-class, .hljs-selector-id, .hljs-selector-pseudo { color: var(--code-attr); }
.hljs-built_in { color: var(--code-builtin); }
.hljs-name { color: var(--code-attr); }
.hljs-bullet { color: var(--code-number); }
.hljs-emphasis { color: var(--code-text); font-style: italic; }
.hljs-strong { color: var(--code-text); font-weight: 700; }
.hljs-addition { color: var(--code-string); background: rgba(156, 217, 160, 0.12); }
.hljs-deletion { color: #f07178; background: rgba(240, 113, 120, 0.12); }
</style>
</head>

<div id="content"><div class="loading">加载中…</div></div>

<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script src="highlight.min.js"></script>
<script>
"use strict";

let currentBaseDir = "";   // 当前文件所在目录 file:// URL, 用于解析相对图片

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function notify(msg) {
  try { window.webkit.messageHandlers.skillReader.postMessage(msg); } catch (e) {}
}

// hljs 输出清洗：把字面 `\n`（两字符）替换为真换行，并防止意外的 </code>/</pre>
// 闭合导致内容溢出到代码块外。
function sanitizeHljs(html) {
  if (!html) return html;
  return html
    .replace(/\\n/g, "\n")
    .replace(/<\/code>/gi, "&lt;/code&gt;")
    .replace(/<\/pre>/gi, "&lt;/pre&gt;");
}

function parseFrontmatter(src) {
  const m = src.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!m) return { fm: null, body: src };
  const fm = {};
  let key = null;
  for (const line of m[1].split("\n")) {
    const kv = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
    if (kv) { key = kv[1]; fm[key] = parseScalar(kv[2]); }
    else if (key && /^\s+-\s+/.test(line)) {
      const item = parseScalar(line.replace(/^\s+-\s+/, ""));
      if (!Array.isArray(fm[key])) fm[key] = fm[key] == null ? [] : [fm[key]];
      fm[key].push(item);
    }
  }
  return { fm, body: src.slice(m[0].length) };
}

// 表格块规整：GFM 规范下，表格内部（含表头与分隔行之间、数据行之间）一旦出现空行，
// marked 会在空行处切断表格，导致表头之后的所有行退化为纯文本。
// 部分编辑器（markdown-it / Typora 等）对此更宽容，故同一份 markdown 在别处能正常渲染、
// 在本阅读器却异常。这里在解析前把「表格行组」内被空行切断的连续行重新拼回完整表格，
// 同时跳过围栏代码块，避免误删代码块内的空行。
function normalizeTableBlocks(src) {
  const lines = src.split("\n");
  const out = [];
  let inFence = false, fenceToken = "";
  let prevTable = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    const fenceMatch = trimmed.match(/^(\s*)(```|~~~)/);
    if (fenceMatch) {
      if (!inFence) { inFence = true; fenceToken = fenceMatch[2]; }
      else if (trimmed.startsWith(fenceToken)) { inFence = false; fenceToken = ""; }
      out.push(line); prevTable = false; continue;
    }
    if (inFence) { out.push(line); prevTable = false; continue; }
    const isTableRow = /^\s*\|/.test(line) || /\|\s*$/.test(trimmed);
    if (line.trim() === "" && prevTable) {
      const next = lines[i + 1];
      if (next !== undefined) {
        const nt = next.trim();
        const nextTableRow = /^\s*\|/.test(next) || /\|\s*$/.test(nt);
        if (nextTableRow) continue; // 跳过表格块内的空行
      }
    }
    out.push(line);
    prevTable = isTableRow;
  }
  return out.join("\n");
}

// 控制字符归一化：U+2028 行分隔符 / U+2029 段分隔符 / U+0085 NEL / U+000B 垂直制表符
// 在 JS 里被当作换行，会让 marked 把表格行 / 列表项从中间劈断，整块结构崩塌。
// 这些字符肉眼不可见（生成工具常把"换行"塞进单元格），统一替换为普通空格。
function normalizeControlSeparators(src) {
  return src.replace(/[\u2028\u2029\u0085\u000B]/g, " ");
}

// 链接目标含空格修复：裸链接 `[text](url)` 的 url 不允许含空格，否则 marked 把链接
// 解析崩、连带破坏所在单元格/表格。把"含空格且未被尖括号包裹"的目标用 <> 包起来
// （marked 支持 `<url with space>` 形式的目的地）。file:// 路径里的中文与全角括号不受影响。
function fixLinkDestinations(src) {
  return src.replace(/(\[[^\]]*\]\()([^)]+)(\))/g, (m, open, url, close) => {
    if (url.includes(" ") && !url.startsWith("<")) return open + "<" + url + ">" + close;
    return m;
  });
}

function parseScalar(v) {
  v = v.trim();
  if (!v) return "";
  if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) return v.slice(1, -1);
  if (v === "true") return true;
  if (v === "false") return false;
  if (/^-?\d+(\.\d+)?$/.test(v)) return /\./.test(v) ? parseFloat(v) : parseInt(v, 10);
  return v;
}

// 将任意本地路径（file:// 或相对路径）转成 srfile:// 协议，由 Swift 侧读取
function toSrfile(src) {
  if (/^srfile:/i.test(src)) return src;
  let abs;
  if (/^file:/i.test(src)) {
    abs = src;
  } else if (/^(https?:|data:|#)/i.test(src)) {
    return src; // 外链 / data / 锚点保持原样
  } else {
    try { abs = new URL(src, currentBaseDir).href; }
    catch (e) { return src; }
  }
  return abs.replace(/^file:\/\//, "srfile://");
}

// 将 markdown 中的图片 src 统一转为 srfile://
function fixRelativeMedia(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  div.querySelectorAll("img").forEach(img => {
    img.src = toSrfile(img.getAttribute("src"));
  });
  return div.innerHTML;
}

// 收集标题生成 TOC
function collectToc() {
  const heads = Array.from(document.querySelectorAll("#content .md-content h1, #content .md-content h2, #content .md-content h3"));
  if (!heads.length) { notify({ action: "toc", items: [] }); return; }
  const items = heads.map((h, i) => {
    if (!h.id) h.id = "sec-" + i;
    return { id: h.id, text: h.textContent.trim(), level: Number(h.tagName[1]) };
  });
  notify({ action: "toc", items: items });
}

// 滚动高亮当前章节
let observer = null;
function observeHeadings() {
  if (observer) observer.disconnect();
  const heads = Array.from(document.querySelectorAll("#content .md-content h1, #content .md-content h2, #content .md-content h3"));
  if (!heads.length) return;
  observer = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      notify({ action: "heading", id: en.target.id, text: en.target.textContent.trim() });
    });
  }, { root: document.getElementById("content"), rootMargin: "-80px 0px -70% 0px" });
  heads.forEach(h => observer.observe(h));
}

function copyText(text) {
  notify({ action: "copy", text: text });
}

function renderMarkdown(p) {
  const { fm, body } = parseFrontmatter(p.content);
  const title = (fm && (fm.name || fm.title)) || p.skillName || p.name;
  const desc = fm && (fm.description || fm.summary);
  const ignored = new Set(["name", "title", "description", "summary"]);
  const chips = fm ? Object.entries(fm)
    .filter(([k]) => !ignored.has(k))
    .map(([k, v]) => {
      const val = Array.isArray(v) ? v.join("、") : String(v);
      return `<span class="fm-chip"><b>${esc(k)}</b>${esc(val)}</span>`;
    }).join("") : "";

  const controlClean = normalizeControlSeparators(body);
  const normalizedBody = fixLinkDestinations(normalizeTableBlocks(controlClean));
  let html = marked.parse(normalizedBody, { gfm: true, breaks: false });
  html = fixRelativeMedia(html);
  // 允许 file:// 与 srfile:// 等本地协议（DOMPurify 默认禁止，会导致播放/图片链接的 href 被剥离）
  const clean = DOMPurify.sanitize(html, {
    ADD_URI_SAFE_ATTR: ["href", "src"],
    ALLOWED_URI_REGEXP: /^(?:(?:f|ht)tps?|file|srfile|mailto|tel|callto|sms|cid|xmpp):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$)/i,
  });

  document.getElementById("content").innerHTML = `
    <article class="md-body">
      ${fm ? `<div class="fm-card">
        <div class="fm-title">${esc(title)}</div>
        ${desc ? `<div class="fm-desc">${esc(String(desc))}</div>` : ""}
        ${chips ? `<div class="fm-chips">${chips}</div>` : ""}
      </div>` : ""}
      <div class="md-content">${clean}</div>
    </article>`;

  // 代码高亮（手动调用 hljs.highlight 后清洗，避免 </code> 意外截断 / 字面 \n）
  document.querySelectorAll("#content .md-body pre code").forEach(el => {
    if (el.dataset.hl !== "1") {
      const lang = (el.className.match(/language-(\S+)/) || [null, "plaintext"])[1];
      try {
        const value = hljs.highlight(el.textContent, { language: lang, ignoreIllegals: true }).value;
        el.innerHTML = sanitizeHljs(value);
      } catch (e) { /* 保留原内容 */ }
      el.dataset.hl = "1";
    }
  });
  // 代码块外包 .md-code 容器 + 悬停复制按钮（按钮在 mouseup 收口范围内点击不受影响）
  document.querySelectorAll("#content .md-body pre").forEach(pre => {
    if (pre.closest(".md-code")) return;
    const wrap = document.createElement("div");
    wrap.className = "md-code";
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "md-code-copy";
    btn.textContent = tr("copyCode");
    btn.addEventListener("click", () => copyText(pre.innerText));
    wrap.appendChild(btn);
  });
  // 链接点击：外链用系统浏览器，本地文件（含相对路径）交给原生播放器/访达打开
  document.querySelectorAll("#content .md-body a").forEach(a => {
    if (!a.dataset.bound) {
      a.dataset.bound = "1";
      a.addEventListener("click", ev => {
        const href = a.getAttribute("href") || "";
        if (/^https?:/i.test(href)) {
          ev.preventDefault();
          notify({ action: "openURL", url: href });
          return;
        }
        // 本地文件：file:// / srfile:// 或相对路径（非锚点/mailto/data）
        if (/^(file:|srfile:)/i.test(href) || !/^(#|mailto:|data:)/i.test(href)) {
          ev.preventDefault();
          notify({ action: "openFile", url: toSrfile(href) });
        }
      });
    }
  });
  collectToc();
  observeHeadings();
}

function renderCode(p) {
  document.body.classList.add("code-view");
  const lines = p.content.split("\n");
  const lang = p.lang || "plaintext";
  let html = p.content;
  try {
    html = hljs.highlight(p.content, { language: lang, ignoreIllegals: true }).value;
  } catch (e) {}
  html = sanitizeHljs(html);
  const gutter = lines.map((_, i) => `<span>${i + 1}</span>`).join("");
  // 复制按钮的 onclick 在 HTML 属性里，需同时满足 JS 字符串 + HTML 属性转义
  const copyPayload = JSON.stringify(p.content)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
  document.getElementById("content").innerHTML = `
    <div class="code-view">
      <div class="code-header">
        <span class="fname">${esc(p.name)}</span>
        <span class="flang">${esc(lang)}</span>
        <span class="fsize">${esc(p.size)} · ${trLines(lines.length)}</span>
        <span class="spacer"></span>
        <button class="text-btn" onclick="copyText(${copyPayload})">${tr("copyCode")}</button>
      </div>
      <div class="code-body">
        <div class="code-gutter">${gutter}</div>
        <pre><code class="language-${esc(lang)}">${html}</code></pre>
      </div>
    </div>`;
  notify({ action: "toc", items: [] });
}

function renderImage(p) {
  const url = toSrfile(p.path);
  document.getElementById("content").innerHTML = `
    <div class="img-view">
      <div class="file-meta">${esc(p.name)} · ${esc(p.size)}</div>
      <img src="${esc(url)}" alt="${esc(p.name)}">
    </div>`;
  notify({ action: "toc", items: [] });
}

function renderPdf(p) {

  document.getElementById("content").innerHTML = `
    <div class="pdf-view">

      <iframe src="${esc(url)}"></iframe>
    </div>`;
  notify({ action: "toc", items: [] });
}

function renderPlain(p) {
  document.getElementById("content").innerHTML = `
    <div class="plain-view">

      <pre>${esc(p.content)}</pre>

  notify({ action: "toc", items: [] });

function renderUnsupported(p) {

// Swift 在运行时切换语言时调用：记忆语言、刷新加载态、若正处于欢迎页则重绘

// 主题切换（Swift 调用）
// 主题模式："auto" | "light" | "dark"
var __themeListener = null;
window.applyTheme = function(mode) {
  if (__themeListener) {
    try { window.matchMedia("(prefers-color-scheme: dark)").removeEventListener("change", __themeListener); } catch (e) {}
    __themeListener = null;
  }
  if (mode === "auto") {
    var m = window.matchMedia("(prefers-color-scheme: dark)");
    var apply = function() { document.documentElement.dataset.theme = m.matches ? "dark" : "light"; };
    apply();
    m.addEventListener("change", apply);
    __themeListener = apply;
    return;
  }
  document.documentElement.dataset.theme = mode;
};

// Swift 调用入口
window.renderSkill = function(p) {
  __findResetOnRender();
  currentBaseDir = p.baseDir || "";
  document.body.className = ""; // 各 render 函数按需加特定视图 class
  if (p.kind === "welcome") { if (p.lang) __lang = (p.lang === "en") ? "en" : "zh"; renderWelcome(); return; }
  if (p.sourceMode && (p.kind === "md")) { renderSource(p); return; }
  switch (p.kind) {
    case "md": renderMarkdown(p); break;
    case "code": case "yaml": case "json": case "toml": renderCode(p); break;
    case "img": renderImage(p); break;
    case "pdf": renderPdf(p); break;
    case "text": renderPlain(p); break;
    default: renderUnsupported(p); break;
  }
};

// Swift 请求滚动到指定标题
window.scrollToHeading = function(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
};

// ---- 正文内查找（find-in-page）----
// 复用 #content .md-content 的 innerHTML 快照：首次进入查找时保存原始 HTML，
// 之后每次重新查找都先从快照还原（同时恢复代码高亮等内联结构），再重新包裹 <mark>。
// 切换文件（renderSkill 重建 #content）时由 __findResetOnRender 清空快照。
let __findSavedHTML = null;
let __findHits = [];
let __findIndex = -1;

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function __findResetOnRender() {
  __findSavedHTML = null;
  __findHits = [];
  __findIndex = -1;
}

function __findClear() {
  const c = document.querySelector("#content .md-content");
  if (c && __findSavedHTML != null) {
    c.innerHTML = __findSavedHTML;
    __findSavedHTML = null;
  }
  __findHits = [];
  __findIndex = -1;
}

// 在当前 .md-content 中重新查找并高亮 query；返回命中数量。
function __findBuild(query, caseSensitive) {
  const c = document.querySelector("#content .md-content");
  if (!c) return 0;
  if (__findSavedHTML == null) __findSavedHTML = c.innerHTML;

  const walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const pe = node.parentElement;
      // 跳过已在高亮里的文本
      if (pe && pe.closest("mark.sr-find")) return NodeFilter.FILTER_REJECT;
      // 跳过代码块复制按钮文字
      if (pe && pe.closest(".md-code-copy")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const textNodes = [];
  let n;
  while ((n = walker.nextNode())) textNodes.push(n);

  let re;
  try {
    re = new RegExp(escapeRegExp(query), caseSensitive ? "g" : "gi");
  } catch (e) {
    return 0;
  }

  // 收集替换计划：每个文本节点按匹配切片为普通片段 / 命中片段
  const ops = [];
  for (const node of textNodes) {
    const text = node.nodeValue;
    re.lastIndex = 0;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    const parts = [];
    let last = 0;
    let m;
    let total = 0;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push({ hit: false, t: text.slice(last, m.index) });
      parts.push({ hit: true, t: m[0] });
      total += 1;
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++; // 防零宽死循环
    }
    if (last < text.length) parts.push({ hit: false, t: text.slice(last) });
    if (parts.length) ops.push({ node, parts, total });
  }

  const count = ops.reduce((sum, o) => sum + o.total, 0);
  if (count === 0) return 0;

  // 从后往前替换，避免前面节点的改动影响后面 nodeValue 的位置
  for (let i = ops.length - 1; i >= 0; i--) {
    const { node, parts } = ops[i];
    const frag = document.createDocumentFragment();
    for (const part of parts) {
      if (part.hit) {
        const mark = document.createElement("mark");
        mark.className = "sr-find";
        mark.textContent = part.t;
        frag.appendChild(mark);
      } else {
        frag.appendChild(document.createTextNode(part.t));
      }
    }
    node.parentNode.replaceChild(frag, node);
  }

  __findHits = Array.from(c.querySelectorAll("mark.sr-find"));
  return __findHits.length;
}

function __findFocusCurrent(reveal) {
  __findHits.forEach(m => m.classList.remove("sr-find-current"));
  const cur = __findHits[__findIndex];
  if (!cur) return;
  cur.classList.add("sr-find-current");
  if (reveal !== false) {
    cur.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

// 入口：q 为空字符串 → 清除高亮。reveal 默认滚动到首个命中。
window.findInPage = function(q, opts) {
  opts = opts || {};
  const query = (q || "").trim();
  __findClear();
  if (!query) {
    notify({ action: "findResult", count: 0, index: -1 });
    return;
  }
  const count = __findBuild(query, !!opts.caseSensitive);
  __findIndex = count > 0 ? 0 : -1;
  __findFocusCurrent(opts.reveal);
  notify({ action: "findResult", count: count, index: __findIndex });
};

window.findInPageNext = function() {
  if (!__findHits.length) return;
  __findIndex = (__findIndex + 1) % __findHits.length;
  __findFocusCurrent(true);
  notify({ action: "findResult", count: __findHits.length, index: __findIndex });
};

window.findInPagePrev = function() {
  if (!__findHits.length) return;
  __findIndex = (__findIndex - 1 + __findHits.length) % __findHits.length;
  __findFocusCurrent(true);
  notify({ action: "findResult", count: __findHits.length, index: __findIndex });
};

window.findInPageClose = function() {
  __findClear();
  notify({ action: "findResult", count: 0, index: -1 });
};

// 选中范围裁剪：三击/拖动时，WebKit 常把相邻的块级元素（段落、列表项、标题、
// 表格等）一起纳入选区。这里在 mouseup 后检测：若选区横跨不同的「选择容器」
// （li 或 .md-content 的直接子块），就把选区裁剪回用户按下鼠标（锚点）所在的容器。
// 裁剪 = 逐边处理：原边界落在容器内就保留原边界，落在容器外才收到容器边界。
// 这样三击选段仍是整段、从段中拖出仍是「从这里到段尾」，既不整块全选，
// 也不会把块尾空白/换行带进剪贴板。
// （不使用 user-select: contain —— WebKit 下它会让双击选中整个元素，见上方 CSS 注释。）
function clipSelectionToContainer(sel, container) {
  if (!container) return;
  // .md-code 是代码块的包裹层（含复制按钮），裁剪目标落到其中的 pre，
  // 否则整块选中会把按钮文字一起复制走。
  if (container.classList && container.classList.contains("md-code")) {
    container = container.querySelector("pre") || container;
  }
  const r = sel.getRangeAt(0);
  const nr = document.createRange();
  nr.selectNodeContents(container);
  if (container.contains(r.startContainer)) nr.setStart(r.startContainer, r.startOffset);
  if (container.contains(r.endContainer)) nr.setEnd(r.endContainer, r.endOffset);
  sel.removeAllRanges();
  sel.addRange(nr);
}

// 双击判定：不依赖引擎是否派发 dblclick，也不依赖 MouseEvent.detail 的语义差异
// （各引擎对 mouseup 的 detail 取值不一致），按「两次 mouseup 的时间与位置」自己判定。
let __lastMouseUp = null;
function isDoubleClick(ev) {
  const now = Date.now();
  const x = ev.clientX || 0, y = ev.clientY || 0;
  const last = __lastMouseUp;
  __lastMouseUp = { t: now, x: x, y: y };
  if (!last) return false;
  if (now - last.t > 500) return false;
  return Math.abs(x - last.x) <= 4 && Math.abs(y - last.y) <= 4;
}

document.addEventListener("mouseup", (ev) => {
  const dbl = isDoubleClick(ev);
  const clicks = (ev && ev.detail) ? ev.detail : 0;
  // 全部同步执行，不用 setTimeout：异步会让「原生选词 / 过宽选区」先被绘制出来、
  // 再被我们替换成目标选区，肉眼可见两段式闪动。mouseup 时 WebKit 的选区已定型，
  // 同步改写是安全的。
  try {
    // 双击：直接选中整段文字
    if (dbl || clicks >= 2) { selectBlockOnDoubleClick(ev.target); return; }
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    const r = sel.getRangeAt(0);
    const nodeOf = (n) => (n && n.nodeType === 3 ? n.parentElement : n);
    const startEl = nodeOf(r.startContainer);
    const endEl = nodeOf(r.endContainer);
    const anchorEl = nodeOf(sel.anchorNode);

    // 1) li 粒度：跨列表项时裁剪回锚点所在 li
    const startLi = startEl.closest("li");
    const endLi = endEl.closest("li");
    if (startLi && endLi && startLi !== endLi) {
      clipSelectionToContainer(sel, anchorEl.closest("li") || startLi);
      return;
    }

    // 2) .md-content 直接子块粒度：跨段落/标题/表格/列表等时裁剪回锚点所在块
    // （正文结构是 article.md-body > div.md-content > p…，必须以 md-content 的
    //   直接子元素为界；以前找「parent 带 md-body 类」会命中 md-content 这一层，
    //   导致这一级从未生效。）
    const outerBlock = (el) => {
      let n = el;
      while (n && n !== document.body) {
        const p = n.parentElement;
        if (p && (p.classList.contains("md-content") || p.classList.contains("md-body"))) return n;
        n = p;
      }
      return null;
    };
    const startBlock = outerBlock(startEl);
    const endBlock = outerBlock(endEl);
    if (startBlock && endBlock && startBlock !== endBlock) {
      clipSelectionToContainer(sel, outerBlock(anchorEl) || startBlock);
    }
  } catch (e) { /* 忽略异常，保持原生选择 */ }
}, true);

// 把范围收缩到「文字本身」：跳过首尾纯空白，只保留首尾非空白字符之间的内容。
// 用于双击选整段，避免复制出来带前导/尾随空白或空行。
function trimRangeToText(range, root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (t) => (/[^\s]/.test(t.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT)
  });
  const first = walker.nextNode();
  if (!first) return;
  let last = first, n;
  while ((n = walker.nextNode())) last = n;
  const startOffset = first.textContent.length - first.textContent.replace(/^\s+/, "").length;
  const endOffset = last.textContent.replace(/\s+$/, "").length;
  range.setStart(first, startOffset);
  range.setEnd(last, endOffset);
}

// 双击选中整段：双击正文文本块时把选区扩展到该块全部文字，但不含块尾空白/换行
// ——复制出来就是干净的段落文本，不会「总带上空白」。
// 代码块（pre/code）与源码/纯文本视图内保持双击选词，方便只复制一个标识符；
// 整块代码用右上角「复制代码」按钮。
// 触发路径有两条，都保留：mouseup 的 detail>=2（WKWebView 一定派发）与 dblclick
// 事件（部分环境下不派发，作为兜底/二次触发，两者结果一致、幂等）。
function selectBlockOnDoubleClick(target) {
  try {
    const sel = window.getSelection();
    if (!sel) return;
    const nodeOf = (n) => (n && n.nodeType === 3 ? n.parentElement : n);
    const el = nodeOf(target);
    if (!el || !el.closest) return;
    // 代码内保持双击选词
    if (el.closest("pre, code, .code-body, .source-view, .plain-view")) return;
    const block = el.closest(
      "p, li, h1, h2, h3, h4, h5, h6, blockquote, td, th, dt, dd, .fm-title, .fm-desc");
    if (!block || !block.closest(".md-body")) return;
    const nr = document.createRange();
    nr.selectNodeContents(block);
    trimRangeToText(nr, block);
    sel.removeAllRanges();
    sel.addRange(nr);
  } catch (e) { /* 忽略异常，保持原生行为 */ }
}

document.addEventListener("dblclick", (ev) => {
  selectBlockOnDoubleClick(ev.target);
});

// 初始加载完成通知
document.addEventListener("DOMContentLoaded", () => {
  notify({ action: "ready" });
});
</script>
</body>
</html>
